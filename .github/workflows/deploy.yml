# GitHub Pages への公開。main に push すると自動でビルドして公開する。
# プルリクエストでは、ビルドと課題チェックだけを行い(結果が PR に ✓ / ✗ で出る)、公開はしない。
# 初回は GitHub のリポジトリ設定 → Pages → Source を「GitHub Actions」にする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR のチェックが、main の公開を途中で止めてしまわないように分ける
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-tasks.mjs
      - name: Build
        run: npm run build
        env:
          # ユーザーサイト(<user>.github.io リポジトリ)なら BASE は / のまま。
          # プロジェクトサイトなら /<リポジトリ名> になる。
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
